[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp3-transcribe-mcp"
version = "0.1.0"
description = "MCP server that splits local MP3 files into chunks and transcribes them offline with faster-whisper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "faster-whisper>=1.2",
    "av>=14,<19",
]

[project.scripts]
mp3-transcribe-mcp = "mp3_transcribe_mcp.server:main"
mp3-transcribe = "mp3_transcribe_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mp3_transcribe_mcp"]
